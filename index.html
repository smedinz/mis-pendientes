<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mis Pendientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 pb-24 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Barra superior -->
    <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <h1 class="text-lg font-bold text-slate-900">Mis Pendientes</h1>
      <button onclick="toggleConfig()" class="text-xs text-blue-600 font-medium">Configurar API</button>
    </header>

    <!-- Modal / Desplegable de Configuración -->
    <div id="config-box" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2">
      <label class="text-xs font-semibold text-slate-500 block">Gemini API Key:</label>
      <input type="password" id="api-key" placeholder="Pega tu clave de Google AI Studio" 
             class="w-full text-xs p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="saveApiKey()" class="w-full bg-slate-900 text-white text-xs font-semibold py-2 rounded-xl">Guardar clave</button>
    </div>

    <!-- Entrada de tareas -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <input type="text" id="task-input" placeholder="¿Qué tienes pendiente?" 
             class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      
      <div class="grid grid-cols-2 gap-2">
        <button onclick="addTask(false)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2.5 px-3 rounded-xl transition">
          Añadir sin IA
        </button>
        <button onclick="addTask(true)" id="btn-add-ai" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-semibold py-2.5 px-3 rounded-xl transition">
          ✨ Añadir con IA
        </button>
      </div>
    </div>

    <!-- Botón Principal: Ordenar con IA -->
    <button onclick="prioritizeTasks()" id="btn-sort" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3.5 rounded-2xl shadow-sm flex items-center justify-center gap-2 transition active:scale-95">
      <span id="sort-label">⚡ Ordenar con IA</span>
    </button>

    <!-- Lista de Tareas -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <ul id="task-list" class="space-y-2"></ul>
      <p id="empty-state" class="text-xs text-slate-400 text-center py-6">No hay tareas pendientes.</p>
    </div>

    <!-- Sección de comentarios / Feedback -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Análisis</span>
        <button onclick="requestFeedback()" id="btn-feedback" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg transition">
          Pedir comentario a la IA
        </button>
      </div>
      <div id="ai-comment-box" class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl min-h-[3.5rem] flex items-center justify-center border border-slate-100">
        <span class="text-slate-400 italic">Toca el botón para analizar tu lista.</span>
      </div>
    </div>

  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('user_tasks') || '[]');
    let apiKey = localStorage.getItem('gemini_api_key') || '';

    if (apiKey) document.getElementById('api-key').value = apiKey;

    function saveApiKey() {
      const val = document.getElementById('api-key').value.trim();
      localStorage.setItem('gemini_api_key', val);
      apiKey = val;
      toggleConfig();
      alert('Clave guardada.');
    }

    function toggleConfig() {
      document.getElementById('config-box').classList.toggle('hidden');
    }

    function renderTasks() {
      const list = document.getElementById('task-list');
      const empty = document.getElementById('empty-state');
      list.innerHTML = '';

      if (tasks.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tasks.forEach((t, index) => {
        const li = document.createElement('li');
        li.className = 'p-3 bg-slate-50 border border-slate-100 rounded-xl flex items-start justify-between gap-2';

        let badge = '';
        if (t.priority) {
          const color = t.priority === 'Alta' ? 'bg-red-100 text-red-700' : (t.priority === 'Media' ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-700');
          badge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${color}">${t.priority}</span>`;
        }

        li.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-slate-400">#${index + 1}</span>
              <span class="text-sm font-medium text-slate-800">${t.text}</span>
              ${badge}
            </div>
            ${t.tag ? `<p class="text-[11px] text-slate-500 mt-1">Categoría: ${t.tag}</p>` : ''}
          </div>
          <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-red-500 text-sm px-1">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function save() {
      localStorage.setItem('user_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
    }

    async function addTask(useAI) {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      if (!useAI) {
        tasks.push({ id: Date.now(), text: text, priority: null, tag: null });
        input.value = '';
        save();
        return;
      }

      if (!apiKey) return alert('Configura tu API Key primero.');

      const btn = document.getElementById('btn-add-ai');
      btn.disabled = true;
      btn.innerText = 'Analizando...';

      try {
        const prompt = `Analiza este pendiente: "${text}". Responde SOLO un JSON: {"prioridad": "Alta"|"Media"|"Baja", "categoria": "palabra_corta"}`;
        const res = await callGemini(prompt, true);
        const data = JSON.parse(res);

        tasks.push({
          id: Date.now(),
          text: text,
          priority: data.prioridad,
          tag: data.categoria
        });

        input.value = '';
        save();
      } catch (e) {
        alert('Error IA: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '✨ Añadir con IA';
      }
    }

    async function prioritizeTasks() {
      if (!apiKey) return alert('Configura tu API Key primero.');
      if (tasks.length < 2) return alert('Ingresa al menos 2 tareas para ordenar.');

      const btn = document.getElementById('btn-sort');
      const label = document.getElementById('sort-label');
      btn.disabled = true;
      label.innerText = 'Reordenando...';

      try {
        const listData = tasks.map(t => ({ id: t.id, texto: t.text }));
        const prompt = `Ordena estas tareas por urgencia e impacto óptimo: ${JSON.stringify(listData)}. Responde SOLO un JSON: {"orden": [id1, id2, ...]}`;

        const res = await callGemini(prompt, true);
        const parsed = JSON.parse(res);

        tasks.sort((a, b) => parsed.orden.indexOf(a.id) - parsed.orden.indexOf(b.id));
        save();
      } catch (e) {
        alert('Error al ordenar: ' + e.message);
      } finally {
        btn.disabled = false;
        label.innerText = '⚡ Ordenar con IA';
      }
    }

    async function requestFeedback() {
      if (!apiKey) return alert('Configura tu API Key primero.');
      if (tasks.length === 0) return alert('No hay tareas para analizar.');

      const btn = document.getElementById('btn-feedback');
      const box = document.getElementById('ai-comment-box');

      btn.disabled = true;
      btn.innerText = 'Pensando...';
      box.innerHTML = '<span class="text-slate-400 italic">Generando análisis...</span>';

      try {
        const taskText = tasks.map((t, i) => `${i + 1}. ${t.text}`).join('\n');
        const prompt = `Actúa como asesor de productividad. En máximo 3 líneas directas, dime cuál tarea abordar de inmediato y un consejo para terminar rápido:\n${taskText}`;

        const comment = await callGemini(prompt, false);
        box.innerHTML = `<p class="text-slate-700 leading-relaxed text-left w-full">${comment.replace(/\\n/g, '<br>')}</p>`;
      } catch (e) {
        box.innerHTML = `<span class="text-red-500">Error: ${e.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Pedir comentario a la IA';
      }
    }

    async function callGemini(prompt, isJson) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: isJson ? { response_mime_type: "application/json" } : {}
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    renderTasks();
  </script>
</body>
</html>
